org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Ember identity -------------------------------------------------------
# Base package of the Kotlin sources. Every module's namespace is derived
# from it (<base>.api, <base>.media, ...). Changing it also requires moving
# the sources: use scripts/rename-package.sh <new.base.package>.
ember.basePackage=io.github.imdxni.ember
# Installed application id. Can be changed freely, without touching sources
# (e.g. to install a fork side by side with the official build).
ember.applicationId=io.github.imdxni.ember
# Version shown in Settings; CI overrides it from the git tag (v1.2.3).
ember.versionName=0.1.0
ember.versionCode=1
