# Pinned native dependencies for :protocol-raop.
# Bump NATIVE_DEPS_VERSION whenever anything in this file or in
# build-native-deps.sh changes, so CI publishes a new prebuilt bundle.
NATIVE_DEPS_VERSION=1

ANDROID_API=25
ANDROID_ABIS=armeabi-v7a arm64-v8a

OPENSSL_VERSION=3.5.9
OPENSSL_URL=https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
OPENSSL_SHA256=603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a

LIBPLIST_VERSION=2.8.0
LIBPLIST_URL=https://github.com/libimobiledevice/libplist/releases/download/2.8.0/libplist-2.8.0.tar.bz2
LIBPLIST_SHA256=b1f59f7634c58b2481325a23ff4e3bf51574a42d868cbe466d2b39b04550752a

# Prebuilt bundle published by .github/workflows/native-deps.yml.
# Gradle downloads it when third_party/prebuilt/ is missing.
# BUNDLE_SHA256 is filled in after the first CI publication; while it is
# empty, build the bundle locally with build-native-deps.sh.
BUNDLE_URL=https://github.com/ImDxni/Ember/releases/download/native-deps-v1/ember-native-deps-v1.tar.gz
BUNDLE_SHA256=
