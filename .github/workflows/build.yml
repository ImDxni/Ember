name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # OpenSSL + libplist only change when third_party/ changes: cache them.
      - name: Cache native dependencies
        id: native-deps
        uses: actions/cache@v6
        with:
          path: third_party/prebuilt
          key: native-deps-${{ hashFiles('third_party/native-deps.properties', 'third_party/build-native-deps.sh') }}

      - name: Build native dependencies
        if: steps.native-deps.outputs.cache-hit != 'true'
        run: bash third_party/build-native-deps.sh --no-bundle

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            name="${GITHUB_REF_NAME#v}"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            base=$(grep '^ember.versionName=' gradle.properties | cut -d= -f2)
            name="$base-dev+${GITHUB_SHA::7}"
            code=$(grep '^ember.versionCode=' gradle.properties | cut -d= -f2)
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version: $name ($code)"

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build APKs
        env:
          EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_KEYSTORE_PASSWORD }}
          EMBER_KEY_ALIAS: ${{ secrets.EMBER_KEY_ALIAS }}
          EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}
        run: >
          bash ./gradlew --no-daemon
          -Pember.versionName=${{ steps.version.outputs.name }}
          -Pember.versionCode=${{ steps.version.outputs.code }}
          :receiver-api:test :app-tv:assembleDebug :app-tv:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          v="${{ steps.version.outputs.name }}"
          for abi in universal armeabi-v7a arm64-v8a; do
            cp "app-tv/build/outputs/apk/release/app-tv-$abi-release.apk" "dist/Ember-$v-$abi.apk"
          done
          cp app-tv/build/outputs/apk/debug/app-tv-universal-debug.apk "dist/Ember-$v-universal-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: ember-apks-${{ steps.version.outputs.name }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ember-apks-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
